name: Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Check code quality
      run: |
        pip install pylint flake8
        flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503 || true
        pylint src/ --disable=all --enable=error,fatal || true

    - name: Data quality checks
      run: |
        python -c "
        import pandas as pd
        from pathlib import Path
        db_path = Path('data/mobility.db')
        if db_path.exists():
            import sqlite3
            conn = sqlite3.connect(db_path)
            cursor = conn.cursor()
            cursor.execute('SELECT COUNT(*) FROM route_measurements')
            count = cursor.fetchone()[0]
            print(f'✅ Database integrity: {count} records found')
            conn.close()
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install black isort pylint

    - name: Check code formatting
      run: |
        black src/ tests/ --check --line-length=120 || true

    - name: Check import sorting
      run: |
        isort src/ tests/ --check-only || true
